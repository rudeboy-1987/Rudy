# Render Infrastructure-as-Code spec
# Docs: https://render.com/docs/blueprint-spec
#
# To use this:
# 1. Push this file to your GitHub repo.
# 2. In Render dashboard → New → Blueprint → connect your repo.
# 3. Render will auto-detect this file and create the service.
# 4. Add your env vars in the Render UI (MongoDB, Twilio, PayPal, Emergent LLM Key).

services:
  - type: web
    name: estimatepro-backend
    runtime: python
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false   # set in Render dashboard (MongoDB Atlas SRV string)
      - key: DB_NAME
        value: estimatepro
      - key: JWT_SECRET
        generateValue: true
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: noreply@donerightelectricltd.com
      - key: CORS_ORIGINS
        value: https://donerightelectricltd.com,https://www.donerightelectricltd.com
